name: Idee vorschlagen / Feature idea
description: Etwas, das Alpi können sollte. · Something Alpi should be able to do.
labels: ["idee", "beta"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Deine Idee / Your idea
      description: Was möchtest du tun, und wie könnte Alpi dabei helfen? · What do you want to do, and how could Alpi help?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Wie machst du das heute? / How do you do it today?
  - type: input
    id: version
    attributes:
      label: Alpi- und macOS-Version / Alpi and macOS version
